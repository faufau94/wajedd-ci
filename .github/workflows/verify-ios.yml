# Verification iOS SANS signature.
#
# Ce depot est public : les runners macOS standards y sont gratuits et sans
# limite de minutes, contrairement a un depot prive ou ils consomment le
# quota a 10x le taux Linux.
#
# Rien de sensible ne doit passer ici :
#   - aucun certificat, aucun profil de provisioning, aucune cle API Apple
#   - aucun IPA signe en artefact (il serait telechargeable par tout le monde)
# La signature et l'envoi vers TestFlight se font sur Codemagic, a partir du
# depot prive.
#
# Seul secret utilise : APP_REPO_TOKEN, un token a portee lecture sur le
# depot prive, necessaire pour cloner le submodule. Un workflow declenche
# par une pull request depuis un fork n'y a pas acces (garanti par GitHub).
name: Verification iOS

# Affiche le message du commit verifie dans la liste des runs, plutot
# qu'un "Verification iOS" repete a l'identique.
run-name: >-
  Verification iOS
  ${{ github.event.client_payload.message && format('— {0}', github.event.client_payload.message) || '' }}

on:
  workflow_dispatch:
  # Declenche par le CI GitLab a chaque push sur dev, une fois les tests
  # Dart passes. Ce depot ne recoit aucun push : le code arrive par le
  # miroir GitLab -> GitHub prive, auquel le submodule fait reference.
  repository_dispatch:
    types: [verify-ios]
  schedule:
    # Filet secondaire : detecte une regression venue d'une dependance
    # externe, sans nouveau commit de notre cote.
    # GitHub desactive un cron apres plusieurs echecs consecutifs, ou
    # apres 60 jours sans activite sur le depot.
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Le submodule pointe vers un depot prive : le token par defaut du
      # job n'a de droits que sur ce depot-ci.
      #
      # On ne se fie pas au commit fige dans .gitmodules, vite perime. Deux
      # cas :
      #   - declenchement par le CI GitLab : on verifie exactement le commit
      #     qui l'a declenche. Le miroir GitLab -> GitHub pouvant avoir
      #     quelques minutes de retard, on attend qu'il arrive plutot que de
      #     verifier un etat anterieur en le faisant passer pour le bon.
      #   - declenchement manuel ou planifie : on prend la tete de dev.
      - name: Recuperer le code source (submodule prive)
        env:
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
        run: |
          git config --global url."https://x-access-token:${APP_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

          cleanup() {
            git config --global --unset url."https://x-access-token:${APP_REPO_TOKEN}@github.com/".insteadOf || true
          }
          trap cleanup EXIT

          git submodule update --init --depth 1 app
          cd app

          if [ -n "$TARGET_SHA" ]; then
            fetched=""
            for attempt in 1 2 3 4 5 6; do
              if git fetch --depth 1 origin "$TARGET_SHA" 2>/dev/null; then
                fetched="yes"
                break
              fi
              echo "Commit $TARGET_SHA pas encore miroite (tentative $attempt/6), nouvelle tentative dans 30 s."
              sleep 30
            done

            if [ -z "$fetched" ]; then
              echo "::error::Le commit $TARGET_SHA n'est pas arrive sur le miroir GitHub apres 3 minutes."
              exit 1
            fi
          else
            git fetch --depth 1 origin dev
          fi

          git checkout FETCH_HEAD
          echo "Commit verifie : $(git rev-parse --short HEAD)"
          git log -1 --format='%s'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Cache paquets Dart
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Dependances Flutter
        working-directory: app
        run: flutter pub get

      - name: Analyse statique
        working-directory: app
        run: flutter analyze

      - name: Tests
        working-directory: app
        run: flutter test

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Dependances iOS (CocoaPods)
        working-directory: app/ios
        run: |
          if [ -f Podfile.lock ]; then
            pod install || pod install --repo-update
          else
            pod install --repo-update
          fi

      - name: Compilation iOS sans signature
        working-directory: app
        run: flutter build ios --release --no-codesign

      # Podfile.lock n'est pas encore dans le depot et ne peut pas etre
      # genere sous Windows. Recuperable ici pour etre commite, ce qui
      # rendra le cache CocoaPods reellement efficace.
      - name: Exposer le Podfile.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Podfile-lock
          path: app/ios/Podfile.lock
          retention-days: 5
